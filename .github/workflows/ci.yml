name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AQT_SOURCE: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install OpenGL system libs
        # qmllint itself doesn't link OpenGL but CMake configure does.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libgl1-mesa-dev libfontconfig1-dev libdbus-1-dev \
            libxkbcommon-dev libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxcb-cursor0 patchelf

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.11.2'
          host: linux
          target: desktop
          arch: linux_gcc_64
          # Qt Graphs depends on Quick3D (3D graphs) since 6.9 — install its chain too.
          modules: 'qtgraphs qtquick3d qtshadertools'
          dir: ${{ runner.workspace }}
          install-deps: false
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true
          cache-key-prefix: qt6112-linux-kit

      - name: Configure (standalone)
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-ci -j"$(nproc)"

      - name: qmllint
        run: cmake --build build-ci --target qmllint

      - name: Tests (Qt Quick Test smoke)
        run: ctest --test-dir build-ci --output-on-failure
